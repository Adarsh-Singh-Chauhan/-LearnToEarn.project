<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">LearnToEarn — Show up. Stack streaks. Earn on-chain.</title>
<desc id="desc">Dark emerald and lime animated technology banner for the LearnToEarn smart-contract project.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset=".55" stop-color="#0c211b"/><stop offset="1" stop-color="#101a25"/></linearGradient>
  <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#e4ff9b"/><stop offset="1" stop-color="#9be56b"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#b8f46b" stop-opacity=".22"/><stop offset="1" stop-color="#b8f46b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c8f9b0" stroke-opacity=".055"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<ellipse cx="930" cy="210" rx="330" ry="250" fill="url(#glow)"><animate attributeName="rx" values="280;360;280" dur="8s" repeatCount="indefinite"/></ellipse>
<circle cx="980" cy="210" r="112" fill="none" stroke="#b8f46b" stroke-opacity=".12" stroke-width="1"><animate attributeName="r" values="96;124;96" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="210" r="78" fill="none" stroke="#b8f46b" stroke-opacity=".25" stroke-width="1.2" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 980 210" to="360 980 210" dur="35s" repeatCount="indefinite"/></circle>
<g transform="translate(880 110)">
  <rect width="198" height="200" rx="26" fill="#142b22" stroke="#b8f46b" stroke-opacity=".38"/>
  <rect x="18" y="18" width="162" height="164" rx="18" fill="#0b1915" stroke="#b8f46b" stroke-opacity=".12"/>
  <path d="M99 42 142 59V96c0 30-18 49-43 62-25-13-43-32-43-62V59Z" fill="#b8f46b" fill-opacity=".1" stroke="url(#lime)" stroke-width="2"/>
  <path d="m76 96 16 16 31-36" fill="none" stroke="#c9ff87" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dasharray" values="0 90;90 0;90 0" dur="3s" repeatCount="indefinite"/></path>
  <text x="99" y="166" fill="#e7f8d6" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">ON-CHAIN STREAK</text>
</g>
<g font-family="Arial,sans-serif">
  <text x="72" y="78" fill="#b8f46b" font-size="14" font-weight="700" letter-spacing="4">A DECENTRALIZED REWARD PROTOCOL</text>
  <text x="68" y="166" fill="#f6fff2" font-size="64" font-weight="900" letter-spacing="-2">LEARN TO EARN</text>
  <text x="72" y="214" fill="url(#lime)" font-size="29" font-weight="800" letter-spacing="1">SHOW UP. STACK STREAKS.</text>
  <text x="72" y="252" fill="#d0e4d4" font-size="22" font-weight="500">EARN ON-CHAIN.</text>
  <text x="72" y="313" fill="#8fae9b" font-size="14" letter-spacing="1">DAILY CHECK-INS  ·  STREAK MILESTONES  ·  TRANSPARENT REWARDS</text>
  <rect x="72" y="345" width="236" height="34" rx="17" fill="#b8f46b" fill-opacity=".12" stroke="#b8f46b" stroke-opacity=".5"/>
  <circle cx="91" cy="362" r="4" fill="#b8f46b"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="105" y="366" fill="#dff9c8" font-size="10" font-weight="700" letter-spacing="2">SOLIDITY · EVM · WEB3</text>
</g>
<path d="M0 410H1200" stroke="#b8f46b" stroke-opacity=".65" stroke-width="3"/>
</svg>