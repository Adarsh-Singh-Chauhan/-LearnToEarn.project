name: Project checks

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - "index.html"
      - "assets/**"
      - ".github/workflows/solidity.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - "index.html"
      - "assets/**"
      - ".github/workflows/solidity.yml"

permissions:
  contents: read

jobs:
  test:
    name: Compile, test and validate the website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Compile contracts
        run: forge build

      - name: Run contract tests
        run: forge test -vv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate frontend JavaScript
        run: node --check assets/app.js

      - name: Validate HTML parsing
        run: python -c "from html.parser import HTMLParser; p=HTMLParser(); p.feed(open('index.html', encoding='utf-8').read()); p.close(); print('index.html parsed successfully')"
